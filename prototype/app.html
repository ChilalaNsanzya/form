<title>Zanaco Explore</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F2F0EE">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

:root{
  --page-bg:#EFECEA; --page-surface:#FFFFFF; --page-sunk:#E5E0DC;
  --page-ink:#17181C; --page-muted:#6E6764; --page-line:#DCD5D0;
  --page-accent:#A2651F; --page-accent-soft:#F4E7D4;
  --font-uix:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page-bg:#131215; --page-surface:#1C1A1E; --page-sunk:#232126;
    --page-ink:#F1EDEA; --page-muted:#A29B97; --page-line:#302D33;
    --page-accent:#E0A85C; --page-accent-soft:#33291C;
  }
}
:root[data-theme="dark"]{
  --page-bg:#131215; --page-surface:#1C1A1E; --page-sunk:#232126;
  --page-ink:#F1EDEA; --page-muted:#A29B97; --page-line:#302D33;
  --page-accent:#E0A85C; --page-accent-soft:#33291C;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page-bg); color:var(--page-ink);
  font-family:var(--font-uix); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding-inline:20px; padding-block:0}
a{color:inherit}

/* ---------- page chrome ---------- */
.masthead{padding-block:40px 24px; border-bottom:1px solid var(--page-line)}
.eyebrow{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--page-accent); margin:0 0 12px;
}
h1{
  font-size:clamp(30px,5.5vw,46px); line-height:1.05; margin:0 0 14px;
  font-weight:800; letter-spacing:-.025em; text-wrap:balance; max-width:16ch;
}
.lede{margin:0; max-width:62ch; color:var(--page-muted); font-size:16px}
.meta-row{
  display:flex; flex-wrap:wrap; gap:8px; margin-top:20px;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.04em;
}
.meta-row span{
  border:1px solid var(--page-line); border-radius:999px;
  padding:4px 10px; color:var(--page-muted);
}

section.block{padding-block:40px; border-bottom:1px solid var(--page-line)}
.sec-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px}
.sec-num{font-family:var(--font-mono); font-size:11px; color:var(--page-accent); letter-spacing:.1em}
h2{font-size:clamp(20px,3vw,26px); margin:0; font-weight:700; letter-spacing:-.02em}
.sec-sub{margin:0 0 26px; color:var(--page-muted); max-width:64ch}

/* ---------- stage ---------- */
.stage{display:grid; grid-template-columns:1fr; gap:32px; align-items:start}
@media(min-width:940px){ .stage{grid-template-columns:auto 1fr; gap:48px} }

.device-col{display:flex; flex-direction:column; align-items:center; gap:14px}
.tabs{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
.tab{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  background:transparent; border:1px solid var(--page-line); color:var(--page-muted);
  border-radius:999px; padding:6px 12px; cursor:pointer; transition:.18s;
}
.tab[aria-selected="true"]{background:var(--page-ink); color:var(--page-bg); border-color:var(--page-ink)}
.tab:focus-visible{outline:2px solid var(--page-accent); outline-offset:2px}

.phone{
  width:min(390px,100%); height:812px; max-height:82vh;
  background:#FFF; border-radius:42px; padding:10px;
  border:1px solid rgba(0,0,0,.14);
  box-shadow:0 2px 3px rgba(20,14,10,.10), 0 26px 60px -18px rgba(20,14,10,.42);
  position:relative; flex:none;
}
:root[data-theme="dark"] .phone{border-color:rgba(255,255,255,.12)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .phone{border-color:rgba(255,255,255,.12)}
}

/* ---------- app shell (fixed light UI — it is a device mock) ---------- */
.app{
  /* TOKENS:START — generated by scripts/build-tokens.mjs, do not edit by hand */
  --brand:#D0212B;
  --gold:#DDA04C;
  --gold-2:#C98B3E;
  --copper:#7F411A;
  --copper-2:#A8672B;
  --copper-ink:#F8EFE5;
  --app-bg:#F2F0EE;
  --app-card:#FFFFFF;
  --app-ink:#17181C;
  --app-muted:#736D69;
  --app-line:#E7E2DD;
  /* TOKENS:END */
  position:absolute; inset:10px; border-radius:33px; overflow:hidden;
  background:var(--app-bg); color:var(--app-ink); display:flex; flex-direction:column;
}
.statusbar{
  flex:none; height:34px; display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; font-size:12px; font-weight:700; letter-spacing:.01em; background:var(--app-bg);
}
.statusbar .sig{display:flex; gap:5px; align-items:center}
.batt{width:22px; height:11px; border:1.4px solid currentColor; border-radius:3px; position:relative; opacity:.9}
.batt::after{content:""; position:absolute; inset:1.6px; right:6px; background:currentColor; border-radius:1px}

.appbar{
  flex:none; display:grid; grid-template-columns:32px 1fr 34px; align-items:center;
  padding:2px 14px 10px; background:var(--app-bg);
}
.appbar h3{margin:0; text-align:center; font-size:17px; font-weight:700; letter-spacing:-.01em}
.iconbtn{
  width:32px; height:32px; display:grid; place-items:center; border:0; background:transparent;
  color:var(--app-ink); cursor:pointer; border-radius:10px;
}
.iconbtn:focus-visible{outline:2px solid var(--brand); outline-offset:1px}
/* PLACEHOLDER MARK — swap for the real Zanaco logo component */
.logobtn{
  width:34px; height:34px; border:0; border-radius:11px; cursor:pointer; padding:0;
  background:var(--brand); color:#fff; display:grid; place-items:center;
  font-family:var(--font-uix); font-size:17px; font-weight:800; letter-spacing:-.04em;
  box-shadow:0 1px 2px rgba(208,33,43,.38);
}
.logobtn:focus-visible{outline:2px solid var(--app-ink); outline-offset:2px}

/* horizontal pager */
.pager{
  flex:1; display:flex; overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x mandatory; scrollbar-width:none;
}
.pager::-webkit-scrollbar{display:none}
.screen{
  min-width:100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always;
  overflow-y:auto; overflow-x:hidden; scrollbar-width:none; padding-bottom:84px;
}
.screen::-webkit-scrollbar{display:none}

/* promo rail */
.rail{
  display:flex; gap:14px; overflow-x:auto; padding:8px 14px 12px; scrollbar-width:none;
  position:sticky; top:0; z-index:6; background:var(--app-bg);
  border-bottom:1px solid var(--app-line);
  /* the rail owns its horizontal gesture — it never pages the screen */
  overscroll-behavior-x:contain; scroll-snap-type:x proximity;
}
.rail::-webkit-scrollbar{display:none}
.promo.new .disc{box-shadow:0 0 0 2px var(--app-bg), 0 0 0 3.6px var(--gold-2)}
.promo{flex:none; width:64px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; scroll-snap-align:start; background:transparent; border:0; padding:0; cursor:pointer; font-family:inherit; color:inherit}
.promo .disc{
  width:56px; height:56px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--font-mono); font-size:10px; font-weight:600; color:#fff;
  letter-spacing:.02em; box-shadow:0 1px 2px rgba(0,0,0,.14);
}
.promo small{font-size:10px; line-height:1.25; color:var(--app-muted); font-weight:600}

/* section titles inside app */
.s-title{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:16px 16px 8px;
}
.s-title h4{margin:0; font-size:15px; font-weight:700; letter-spacing:-.01em}
.s-title a{
  font-size:12px; font-weight:600; color:var(--gold-2); text-decoration:none;
}

/* placeholder imagery */
.ph{
  position:relative; border-radius:12px; overflow:hidden; background:#888;
  display:grid; place-items:end start;
}
.ph span{
  position:relative; z-index:1;
  font-family:var(--font-mono); font-size:8.5px; letter-spacing:.06em; text-transform:uppercase;
  color:rgba(255,255,255,.88); padding:6px 7px; line-height:1;
}
.ph::before{
  content:""; position:absolute; inset:0;
  background-image:radial-gradient(circle at 78% 18%, rgba(255,255,255,.26), transparent 46%),
                   linear-gradient(200deg, rgba(255,255,255,.14), rgba(0,0,0,.30));
}

/* hero card */
.hero{
  margin:0 14px; background:var(--app-card); border-radius:16px; overflow:hidden;
  box-shadow:0 1px 2px rgba(23,24,28,.07), 0 10px 22px -14px rgba(23,24,28,.35);
}
.hero .ph{border-radius:0; aspect-ratio:16/9; width:100%}
.hero .body{padding:14px 14px 15px}
.hero .kicker{
  font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--gold-2); font-weight:600;
}
.hero h5{margin:6px 0 4px; font-size:16px; font-weight:700; letter-spacing:-.01em}
.hero p{margin:0 0 13px; font-size:12.5px; line-height:1.45; color:var(--app-muted)}
.cta{
  width:100%; display:flex; align-items:center; justify-content:space-between;
  background:var(--gold); color:#2B1A06;
  border:0; border-radius:14px; padding:15px 16px; font-family:inherit;
  font-size:15px; font-weight:700; letter-spacing:-.005em; cursor:pointer;
}
.cta:focus-visible{outline:2px solid var(--app-ink); outline-offset:2px}
.cta.ghost{background:transparent; border:1.5px solid var(--copper-2); color:var(--copper-2)}
.cta.sm{padding:12px 13px; font-size:13.5px; border-radius:12px}

/* tier-2 carousel */
.carousel{display:flex; gap:12px; overflow-x:auto; padding:0 14px 4px; scroll-snap-type:x mandatory; scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.c-card{flex:none; scroll-snap-align:start; text-decoration:none; color:inherit}
.c-card.poster{width:126px}
.c-card.poster .ph{aspect-ratio:2/3; width:100%}
.c-card.wide{width:190px; background:var(--app-card); border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(23,24,28,.07)}
.c-card.wide .ph{aspect-ratio:3/2; border-radius:0}
.c-card.wide .cap{padding:9px 11px 11px}
.c-card .name{margin:8px 0 2px; font-size:12.5px; font-weight:700; line-height:1.25}
.c-card.wide .name{margin-top:0}
.c-card .sub{font-size:11px; color:var(--app-muted); line-height:1.3}
.price{font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--app-ink)}

/* tile grid */
.tilegrid{display:grid; gap:10px; padding:0 14px}
.tilegrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tilegrid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tilegrid.c4 .tile{padding:10px 5px}
.tilegrid.c4 .tile b{font-size:10.5px}
.tile{
  background:var(--app-card); border:1px solid var(--app-line); border-radius:14px;
  padding:11px 8px; text-align:center; display:flex; flex-direction:column;
  align-items:center; gap:7px; cursor:pointer; font-family:inherit;
}
.tile .glyph{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; color:#fff}
.tile b{font-size:11px; font-weight:700; line-height:1.2; overflow-wrap:anywhere}
.tile small{font-size:9.5px; color:var(--app-muted); line-height:1.2}

/* segmented control */
.segment{
  display:flex; gap:4px; margin:0 14px 14px; background:#E6E1DC;
  border-radius:12px; padding:4px;
}
.segment button{
  flex:1; border:0; background:transparent; font-family:inherit; font-size:12.5px; font-weight:700;
  color:var(--app-muted); padding:8px 0; border-radius:9px; cursor:pointer;
}
.segment button[aria-pressed="true"]{background:#fff; color:var(--app-ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Zanaco card — copper */
.zcard{
  margin:16px 14px 0; color:var(--copper-ink); border-radius:18px; padding:15px;
  position:relative; overflow:hidden;
  background:linear-gradient(152deg,#95511F 0%,var(--copper) 46%,#4E2710 100%);
}
.zcard::after{
  content:""; position:absolute; width:190px; height:190px; right:-68px; top:-84px;
  border-radius:50%; background:radial-gradient(circle,rgba(255,206,150,.26),transparent 66%);
}
.zcard .tag{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono);
  font-size:9px; letter-spacing:.13em; text-transform:uppercase; font-weight:600;
  color:#F6D4AC; border:1px solid rgba(246,212,172,.5); border-radius:999px; padding:3px 9px;
  position:relative;
}
.zcard h5{margin:10px 0 3px; font-size:15px; font-weight:700; position:relative}
.zcard p{margin:0 0 12px; font-size:11.5px; line-height:1.45; color:rgba(248,239,229,.76); position:relative}
.z-actions{display:flex; flex-direction:column; gap:7px; position:relative}
.z-act{
  display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.10);
  border:1px solid rgba(255,235,215,.18); border-radius:12px; padding:10px 11px;
  cursor:pointer; text-align:left; font-family:inherit; color:inherit; width:100%;
}
.z-act .dot{width:29px; height:29px; border-radius:9px; display:grid; place-items:center; background:rgba(255,214,170,.20); color:#FBDDB6; flex:none}
.z-act b{display:block; font-size:12.5px; font-weight:700}
.z-act small{display:block; font-size:10.5px; color:rgba(248,239,229,.70); line-height:1.3}
.z-act .chev{margin-left:auto; color:rgba(248,239,229,.6)}

/* tenders */
.duo{display:flex; gap:9px; padding:0 14px 12px}
.duo button{flex:1; justify-content:center; gap:7px}
.tender-val{font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--copper-2); font-variant-numeric:tabular-nums}
.closing{font-size:10px; font-weight:700; color:#B03A2E}

/* shared list flow */
.people{display:flex; padding:0 14px 12px}
.people .who{
  width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
  font-size:10.5px; font-weight:700; color:#fff; border:2px solid var(--app-bg); margin-right:-8px;
}
.people .add{background:transparent; color:var(--copper-2); border:1.5px dashed var(--copper-2)}
.item{display:flex; align-items:center; gap:11px; padding:11px 12px; border-bottom:1px solid var(--app-line); width:100%; background:transparent; border-left:0; border-right:0; border-top:0; font-family:inherit; text-align:left; cursor:pointer; color:inherit}
.item:last-child{border-bottom:0}
.box{width:20px; height:20px; border-radius:6px; border:1.6px solid #C9C2BB; flex:none; display:grid; place-items:center; color:#fff}
.box svg{opacity:0}
.item[data-done="1"] .box svg{opacity:1}
.item[data-done="1"] .box{background:var(--copper-2); border-color:var(--copper-2)}
.item[data-done="1"] b{text-decoration:line-through; color:var(--app-muted)}
.item b{display:block; font-size:13px; font-weight:600}
.item small{display:block; font-size:10.5px; color:var(--app-muted)}
.item .qty{margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--app-muted)}
.totalbar{display:flex; justify-content:space-between; align-items:center; margin:12px 14px 0; padding:12px 14px; background:var(--app-card); border-radius:13px}
.totalbar b{font-size:15px; font-variant-numeric:tabular-nums}
.totalbar small{font-size:10.5px; color:var(--app-muted); display:block}
.flowstrip{display:flex; gap:22px; overflow-x:auto; padding-bottom:10px}
.flowstrip>div{flex:none; width:390px; max-width:100%}
.flowcap{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--page-muted); text-align:center; margin-top:10px}
.phone.flow{height:700px}

/* list rows */
.list{margin:0 14px; background:var(--app-card); border-radius:14px; overflow:hidden}
.row{
  display:flex; align-items:center; gap:11px; padding:11px 12px; width:100%;
  background:transparent; border:0; border-bottom:1px solid var(--app-line);
  font-family:inherit; text-align:left; cursor:pointer; color:inherit;
}
.row:last-child{border-bottom:0}
.row .thumb{width:40px; height:40px; border-radius:11px; flex:none; display:grid; place-items:center; color:#fff}
.row .txt{min-width:0; flex:1}
.row b{display:block; font-size:13px; font-weight:700; line-height:1.3}
.row small{display:block; font-size:11px; color:var(--app-muted); line-height:1.35}
.row .chev{color:#B9B2AC; flex:none}
.row .act{font-size:11.5px; font-weight:700; color:var(--gold-2); flex:none}

/* search field */
.searchbar{margin:0 14px 14px; display:flex; align-items:center; gap:9px; background:var(--app-card); border:1px solid var(--app-line); border-radius:13px; padding:11px 13px}
.searchbar input{border:0; outline:0; font-family:inherit; font-size:13px; flex:1; background:transparent; color:var(--app-ink)}
.searchbar input::placeholder{color:#A49D97}


/* input-first screens */
.field{
  display:flex; align-items:center; gap:10px; margin:0 14px 8px; padding:12px 13px;
  background:var(--app-card); border:1px solid var(--app-line); border-radius:13px;
}
.field .lab{font-family:var(--font-mono); font-size:9px; letter-spacing:.11em; text-transform:uppercase; color:var(--app-muted); display:block; margin-bottom:2px}
.field input{border:0; outline:0; background:transparent; font-family:inherit; font-size:14px; font-weight:600; color:var(--app-ink); width:100%; padding:0}
.field input::placeholder{color:#A9A29C; font-weight:500}
.field .pin{width:30px; height:30px; border-radius:9px; background:#F0EAE3; color:var(--copper-2); display:grid; place-items:center; flex:none}
.field .txt{flex:1; min-width:0}
.field.focusable:focus-within{border-color:var(--copper-2); box-shadow:0 0 0 3px rgba(168,103,43,.13)}
.journey{position:relative}
.swap{
  position:absolute; right:22px; top:50%; transform:translateY(-50%); z-index:2;
  width:34px; height:34px; border-radius:50%; background:var(--app-card);
  border:1px solid var(--app-line); color:var(--copper-2); display:grid; place-items:center; cursor:pointer;
}
.chiprow{display:flex; gap:7px; overflow-x:auto; padding:4px 14px 12px; scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:none; border:1px solid var(--app-line); background:var(--app-card); border-radius:999px;
  padding:7px 12px; font-family:inherit; font-size:11.5px; font-weight:600; color:var(--app-muted);
  cursor:pointer; display:flex; align-items:center; gap:5px;
}
.chip[aria-pressed="true"]{background:#2C2A28; color:#fff; border-color:#2C2A28}
.hint{margin:0 14px 12px; font-size:11.5px; color:var(--app-muted); line-height:1.45}
.view[hidden]{display:none}
.summary{
  margin:0 14px 12px; background:var(--app-card); border-radius:16px; padding:14px;
  box-shadow:0 1px 2px rgba(23,24,28,.07);
}
.summary .route{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700}
.summary .facts{display:flex; gap:14px; margin-top:10px; padding-top:11px; border-top:1px solid var(--app-line)}
.summary .facts div{flex:1}
.summary .facts b{display:block; font-size:14px; font-variant-numeric:tabular-nums}
.summary .facts small{display:block; font-size:10px; color:var(--app-muted); font-family:var(--font-mono); letter-spacing:.06em; text-transform:uppercase}
.valuecard{
  margin:0 14px 12px; border-radius:16px; padding:16px; color:#fff;
  background:linear-gradient(150deg,#2F5E73,#17323F);
}
.valuecard h5{margin:0 0 5px; font-size:16px; font-weight:700}
.valuecard p{margin:0 0 13px; font-size:12px; line-height:1.45; color:rgba(255,255,255,.76)}

/* footer nav */
.tabbar{
  position:absolute; left:10px; right:10px; bottom:10px;
  background:var(--brand); border-radius:26px; display:grid; grid-template-columns:repeat(5,1fr);
  padding:9px 6px calc(9px + env(safe-area-inset-bottom,0px)); box-shadow:0 8px 20px -8px rgba(208,33,43,.55);
}
.navbtn{
  border:0; background:transparent; color:rgba(255,255,255,.72); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:2px 0;
  font-family:inherit; font-size:9.5px; font-weight:600; position:relative; white-space:nowrap;
}
.navbtn[aria-current="page"]{color:#fff}
.navbtn[aria-current="page"]::after{
  content:""; position:absolute; bottom:-5px; width:14px; height:2.5px; border-radius:2px; background:#fff;
}
.navbtn:focus-visible{outline:2px solid #fff; outline-offset:2px; border-radius:8px}


.fullscreen{
  display:inline-flex; align-items:center; gap:8px; margin-top:18px;
  background:var(--page-ink); color:var(--page-bg); text-decoration:none;
  border-radius:999px; padding:10px 18px; font-size:14px; font-weight:700;
}
.fullscreen:focus-visible{outline:2px solid var(--page-accent); outline-offset:3px}

/* ---- the spec page on a phone ---- */
@media (max-width:640px){
  .wrap{padding-inline:16px}
  .masthead{padding-block:26px 20px}
  section.block{padding-block:28px}
  /* the device frame is pointless on a device — show the app itself */
  .phone{
    width:100%; height:640px; max-height:none; padding:0;
    border-radius:20px; border:1px solid rgba(0,0,0,.16);
    box-shadow:0 1px 2px rgba(20,14,10,.10), 0 14px 28px -18px rgba(20,14,10,.45);
  }
  .phone .app{inset:0; border-radius:19px}
  .phone .statusbar{display:none}
  .phone .appbar{padding-top:12px}
  .tabs{gap:5px}
  .tab{padding:6px 10px}
  .flowstrip{gap:14px; margin-inline:-16px; padding-inline:16px}
  .flowstrip>div{width:300px}
  .phone.flow{height:560px}
  .stage{gap:24px}
  .note{padding:15px}
  ol.steps{padding-left:18px}
}

/* notes column */
.notes{display:flex; flex-direction:column; gap:16px}
.note{background:var(--page-surface); border:1px solid var(--page-line); border-radius:14px; padding:18px}
.note h3{margin:0 0 8px; font-size:15px; font-weight:700}
.note p{margin:0 0 10px; font-size:14px; color:var(--page-muted)}
.note p:last-child{margin-bottom:0}
.note strong{color:var(--page-ink)}
.verdict{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--page-accent); background:var(--page-accent-soft); border-radius:6px;
  padding:3px 8px; display:inline-block; margin-bottom:10px;
}

/* spec tables */
.spec-grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.spec{background:var(--page-surface); border:1px solid var(--page-line); border-radius:14px; padding:16px}
.spec h3{margin:0 0 4px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px}
.spec .dotmark{width:9px; height:9px; border-radius:50%; flex:none}
.spec .role{font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--page-muted); margin-bottom:12px}
.stack{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0}
.stack li{
  display:flex; gap:10px; align-items:baseline; padding:8px 0; border-bottom:1px dashed var(--page-line);
  font-size:13px;
}
.stack li:last-child{border-bottom:0}
.stack .idx{font-family:var(--font-mono); font-size:10px; color:var(--page-accent); flex:none; width:16px}
.stack .lbl{font-weight:700; flex:none}
.stack .dsc{color:var(--page-muted); font-size:12.5px}

table.tok{width:100%; border-collapse:collapse; font-size:13px}
table.tok th,table.tok td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--page-line); vertical-align:middle}
table.tok th{font-family:var(--font-mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--page-muted); font-weight:500}
table.tok td.val{font-family:var(--font-mono); font-size:12px; font-variant-numeric:tabular-nums}
.swatch{display:inline-block; width:18px; height:18px; border-radius:5px; border:1px solid rgba(0,0,0,.14); vertical-align:-4px; margin-right:9px}
.tablewrap{overflow-x:auto; background:var(--page-surface); border:1px solid var(--page-line); border-radius:14px; padding:4px 6px}

ol.steps{margin:0; padding-left:20px; max-width:66ch}
ol.steps li{margin-bottom:12px; color:var(--page-muted)}
ol.steps li strong{color:var(--page-ink)}
.foot{padding-block:32px 48px; color:var(--page-muted); font-size:13px; font-family:var(--font-mono)}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto !important; transition:none !important} }


/* ---- phone-native shell: the app fills the viewport, no device frame ---- */
html,body{height:100%; overflow:hidden; overscroll-behavior:none}
body{background:#F2F0EE; padding:0}
.app{
  position:fixed; inset:0; border-radius:0; height:100%;
  padding-top:env(safe-area-inset-top,0px);
}
.appbar{padding-top:10px}
.tabbar{
  left:12px; right:12px; bottom:max(10px, env(safe-area-inset-bottom, 0px));
  padding-bottom:9px;
}
.screen{padding-bottom:112px; -webkit-overflow-scrolling:touch}
/* keyboard-free tap targets on a real device */
.row,.tile,.chip,.cta,.z-act,.navbtn,.item,.c-card{-webkit-tap-highlight-color:transparent}
.row:active,.z-act:active,.item:active{background:rgba(0,0,0,.035)}

/* ---- the grocery list flow becomes a sheet over the app ---- */
#sheet{
  position:fixed; inset:0; z-index:40; background:var(--app-bg,#F2F0EE);
  padding-top:env(safe-area-inset-top,0px);
  transform:translateY(100%); transition:transform .26s cubic-bezier(.32,.72,0,1);
}
#sheet.open{transform:translateY(0)}
#flows{height:100%}
#flows>div{display:none; height:100%}
#flows>div.on{display:block}
#flows .phone.flow{
  width:100%; height:100%; max-height:none; border:0; box-shadow:none;
  padding:0; border-radius:0; background:transparent;
}
#flows .phone.flow .app{position:absolute; inset:0; padding-top:0}
#flows .statusbar{display:none}
#flows .flowcap{display:none}
@media (prefers-reduced-motion: reduce){ #sheet{transition:none} }

const label=document.getElementById("route-label");

function showRoute(a,b){
  from.value=a; to.value=b;
  const key=`${a.trim().toLowerCase()}|${b.trim().toLowerCase()}`;
  const r=ROUTES[key]||ROUTES[`${b.trim().toLowerCase()}|${a.trim().toLowerCase()}`];
  empty.hidden=true;
  if(!r){
    results.hidden=true; none.hidden=false;
    document.getElementById("none-label").textContent=`No routes for ${a} → ${b} yet`;
    none.scrollIntoView({behavior:"smooth",block:"nearest"});
    return;
  }
  none.hidden=true; results.hidden=false;
  label.textContent=`${a} → ${b}`;
  document.getElementById("f-km").textContent=r.km;
  document.getElementById("f-toll").textContent=r.toll;
  document.getElementById("f-time").textContent=r.time;
  document.getElementById("trip-modes").innerHTML=
    r.modes.map(m=>`<button class="row"><span class="thumb" style="background:${m[1]}">${ic(m[0],19)}</span>
      <span class="txt"><b>${m[2]}</b><small>${m[3]}</small></span>
      <span class="tender-val">${m[4]}</span><span class="chev">${ic("chev",16)}</span></button>`).join("")
    +`<button class="row"><span class="thumb" style="background:#1F6F5C">${ic("bed",19)}</span>
      <span class="txt"><b>Lodges in ${r.lodgeCity}</b><small>${r.lodges} available for tonight</small></span>
      <span class="chev">${ic("chev",16)}</span></button>`;
  document.getElementById("trip-zcard").innerHTML=
    zc("Pay for this journey","Set it once and the road takes care of itself.",[
      ["car","Smart toll auto-pay",`${r.toll} on this route, paid as you pass`],
      ["shield","Travel Insurance","Medical, delay and baggage from K95"]]);
  results.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ---- sheet behaviour (phone build only) ---- */
const sheet=document.getElementById("sheet");
const panes=()=>[...document.querySelectorAll("#flows > div")];
function openSheet(i){
  panes().forEach((p,n)=>p.classList.toggle("on", n===i));
  sheet.classList.add("open"); sheet.setAttribute("aria-hidden","false");
}
function closeSheet(){ sheet.classList.remove("open"); sheet.setAttribute("aria-hidden","true"); }

document.addEventListener("click",e=>{
  const act=e.target.closest(".z-act");
  if(act && /Family Grocery List|AI Grocery List/.test(act.textContent)){ openSheet(0); return; }

  const inSheet=e.target.closest("#sheet");
  if(!inSheet) return;

  // the appbar back control in each pane
  if(e.target.closest(".appbar .iconbtn")){
    const open=panes().findIndex(p=>p.classList.contains("on"));
    open > 0 ? openSheet(open-1) : closeSheet();
    return;
  }
  // opening a list from the index pane
  const paneIndex=panes().findIndex(p=>p.contains(e.target));
  if(paneIndex===0 && e.target.closest(".list .row")) openSheet(1);
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
